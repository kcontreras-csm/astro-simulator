<!DOCTYPE html>
<!-- saved from url=(0061)https://david-bazalduaa.github.io/Salesforce_Admin_Questions/ -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Astro Simulator — a study center for Salesforce certification practice exams with study/exam modes, Rapid Fire drills, flags, and real-time scoring.">
  <title>Astro Simulator</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns=&#39;http://www.w3.org/2000/svg&#39; viewBox=&#39;0 0 100 100&#39;&gt;&lt;rect width=&#39;100&#39; height=&#39;100&#39; rx=&#39;24&#39; fill=&#39;%231A9E52&#39;/&gt;&lt;path d=&#39;M54 14 26 56h22l-6 30 30-44H50z&#39; fill=&#39;white&#39;/&gt;&lt;/svg&gt;">
  <!-- Apply saved theme before first paint to avoid a flash -->
  <script>
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('plat_admn_301_theme') || '{}');
        var accents = ['green', 'blue', 'purple', 'amber', 'pink'];
        document.documentElement.dataset.accent = accents.indexOf(t.accent) > -1 ? t.accent : 'green';
        document.documentElement.dataset.appearance = t.appearance === 'dark' ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.accent = 'green';
        document.documentElement.dataset.appearance = 'light';
      }
    })();
  </script>
</head>
<body>

  <!-- ===== STUDY CENTER HOME ===== -->
  <section class="home-screen" id="home-screen" aria-label="Study Center home">
    <div class="home-sparkles" aria-hidden="true">
      <i data-icon="sparkles"></i><i data-icon="star"></i><i data-icon="cloud"></i><i data-icon="sparkles"></i><i data-icon="star"></i><i data-icon="cloud"></i><i data-icon="zap"></i>
    </div>
    <div class="home-inner">
      <div class="home-hero">
        <div class="home-mascot" id="home-mascot"></div>
        <div class="home-kicker"><i data-icon="footprints"></i> Pick your trail</div>
        <h1>Astro Simulator</h1>
        <p>Your cozy study center for Salesforce certification practice. Choose an exam and let's earn those points!</p>
        <div class="home-stats" id="home-stats"></div>
      </div>
      <div class="home-tiles" id="home-tiles"><!-- exam tiles rendered by renderHome() --></div>
      <footer class="home-footer">
        <span class="made-with">Made with <i data-icon="heart" class="heart"></i> for Trailblazers</span>
        <a class="gh-link" href="https://github.com/kcontreras-csm/plat-admin-2-sim" target="_blank" rel="noopener" aria-label="View source on GitHub" title="View source on GitHub">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58 0-.29-.01-1.05-.02-2.06-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5.99.11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.11-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.61-2.81 5.63-5.49 5.92.43.37.81 1.1.81 2.22 0 1.6-.01 2.9-.01 3.29 0 .32.22.7.83.58A12.01 12.01 0 0 0 24 12.5C24 5.87 18.63.5 12 .5z"/></svg>
          <span>View on GitHub</span>
        </a>
      </footer>
    </div>
  </section>

  <!-- ===== APP HEADER ===== -->
  <header class="app-header">
    <div class="header-top">
      <!-- Brand (click to return to the Study Center home) -->
      <button type="button" class="header-brand" onclick="showHome()" title="Back to Study Center home">
        <div class="logo-icon"></div>
        <h1>
          Astro Simulator
          <span>Loading…</span>
        </h1>
      </button>

      <div class="header-controls">

        <!-- Group: metrics -->
        <div class="score-matrix hc-group" role="group" aria-label="Session score">
          <div class="score-pill" id="pill-progress" title="Questions answered">
            <i data-icon="progress"></i><span class="pill-label">Progress</span><span class="pill-value">0/150</span>
            <span class="pill-bar" aria-hidden="true"></span>
          </div>
          <div class="score-pill" id="pill-score" title="Correct answers so far">
            <span class="status-dot" aria-hidden="true"></span><span class="pill-label">Score</span><span class="pill-value">0.0%</span>
          </div>
        </div>

        <!-- Exam timer + submit (hidden until Exam mode) -->
        <div class="exam-timer" id="exam-timer">
          <i data-icon="timer" class="timer-icon"></i>
          <span id="timer-text">01:45:00</span>
        </div>
        <button class="submit-exam-btn" id="submit-exam-btn">Submit Exam</button>

        <!-- Group: mode (segmented control around the original checkbox) -->
        <label class="mode-seg" title="Switch between Study and a timed Exam">
          <input type="checkbox" id="mode-toggle" aria-label="Exam mode">
          <span class="mode-seg-opt" data-mode="study"><i data-icon="book"></i>Study</span>
          <span class="mode-seg-opt" data-mode="exam"><i data-icon="timer"></i>Exam</span>
        </label>

        <!-- Group: actions -->
        <div class="hc-group hc-actions">
          <button type="button" class="hbtn hbtn-primary btn-rapid-launch" id="btn-rapid-launch" onclick="startRapid()" title="Rapid Fire: random questions, one after another"><i data-icon="zap"></i><span>Rapid Fire</span></button>
        </div>

        <!-- Group: overflow menu (answer key, reset, theme) -->
        <div class="theme-control">
          <button type="button" class="btn-theme" id="theme-btn" onclick="toggleThemeMenu()" aria-haspopup="true" aria-expanded="false" title="More options" aria-label="More options"><i data-icon="more"></i></button>
          <div class="theme-menu hidden" id="theme-menu" role="menu">
            <button type="button" class="menu-item btn-answers" id="btn-answers" role="menuitemcheckbox" onclick="toggleAnswerKey()" aria-pressed="false" title="Show every question's correct answer and explanation"><i data-icon="eye"></i><span>Answers</span></button>
            <button type="button" class="menu-item menu-item-danger btn-reset-session" id="btn-reset-session" role="menuitem" onclick="toggleThemeMenu(false); resetSession()" title="Clear your saved study progress (flags are kept)"><i data-icon="reset"></i><span>Reset progress</span></button>
            <div class="theme-menu-sep"></div>
            <div class="theme-menu-label">Accent</div>
            <div class="theme-swatches">
              <button type="button" class="theme-accent-swatch" data-accent="green"  onclick="setAccent('green')"  title="Green"  aria-label="Green accent"></button>
              <button type="button" class="theme-accent-swatch" data-accent="blue"   onclick="setAccent('blue')"   title="Blue"   aria-label="Blue accent"></button>
              <button type="button" class="theme-accent-swatch" data-accent="purple" onclick="setAccent('purple')" title="Purple" aria-label="Purple accent"></button>
              <button type="button" class="theme-accent-swatch" data-accent="amber"  onclick="setAccent('amber')"  title="Amber"  aria-label="Amber accent"></button>
              <button type="button" class="theme-accent-swatch" data-accent="pink"   onclick="setAccent('pink')"   title="Pink"   aria-label="Pink accent"></button>
            </div>
            <div class="theme-menu-row">
              <label for="theme-dark-toggle"><i data-icon="moon"></i> Dark mode</label>
              <input type="checkbox" class="toggle-switch" id="theme-dark-toggle" aria-label="Toggle dark mode">
            </div>
          </div>
        </div>
      </div><!-- /.header-controls -->
    </div>

    <!-- Tab Navigation -->
    <nav class="tab-nav" id="tab-nav" role="tablist" aria-label="Exam sections"></nav>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main id="app-container" class="">
    <div class="tab-content" id="tab-content"><!-- panes generated per-exam by ensureTabPanes() --></div>
  </main>

  <!-- ===== EXAM RESULTS OVERLAY ===== -->
  <div class="results-overlay" id="results-overlay">
    <div class="results-modal"></div>
  </div>

  <!-- ===== RAPID FIRE OVERLAY ===== -->
  <div class="rapid-overlay" id="rapid-overlay">
    <div class="rapid-modal">
      <button type="button" class="rapid-exit" id="rapid-exit" onclick="exitRapid()" title="Exit Rapid Fire (Esc)" aria-label="Exit Rapid Fire"><i data-icon="x"></i></button>
      <div class="rapid-body" id="rapid-body"></div>
      <div class="rapid-hint">Pick with keys <kbd>1</kbd>–<kbd>5</kbd> · <kbd>Enter</kbd> next · <kbd>Esc</kbd> exit</div>
    </div>
  </div>

  <!-- ===== APPLICATION SCRIPT ===== -->
  <script src="./assets/icons.js"></script>
  <script src="./app.js"></script>



</body></html>
